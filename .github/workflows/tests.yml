name: Tests

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs in parallel with the tests. Rules are set in pyproject.toml.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Pinned so a new ruff release can't start failing CI on its own.
      - name: Install ruff
        run: python -m pip install ruff==0.17.6

      - name: Run ruff
        run: ruff check --output-format=github .

      # Fails if any file isn't formatted; fix it locally with "ruff format .".
      - name: Check formatting
        if: ${{ !cancelled() }} # run even if the lint step failed, to show both results
        run: ruff format --check --diff .

  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # show every OS result even if one fails
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.13"]
        include:
          # Oldest Python the app supports (README: 3.10+).
          - os: ubuntu-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # The AI tests use a fake Claude client, so no API key is needed.
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  # The web API (flash/api) and its Docker image. The desktop jobs above
  # don't install the API libraries, so there the API tests are skipped.
  api:
    name: Web API + Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-api.txt httpx

      - name: Run API tests
        run: python -m unittest tests.test_api -v

      - name: Build the Docker image
        run: docker build -t flash-api .

      - name: Start a container and check /health
        run: |
          docker run -d --name flash-api -p 8000:8000 flash-api
          for _ in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          docker logs flash-api
          exit 1
