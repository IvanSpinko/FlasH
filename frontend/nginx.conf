# Serves the built web app and forwards /api/... to the API container.
server {
    listen 80;
    root /usr/share/nginx/html;

    # PDFs can be large.
    client_max_body_size 50m;

    # /api/decks -> http://api:8000/decks (the trailing slash drops "/api").
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Built files have a hash in their name, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else is the app itself.
    location / {
        try_files $uri /index.html;
    }
}
