# Security headers for the web app's pages and files (included by nginx.conf).
# Kept out of /api/ on purpose: the API's /docs page loads Swagger UI from a CDN.

# Only load scripts, styles and data from this site; never inside someone else's frame.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
