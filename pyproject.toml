# Tool settings only; FlasH is not packaged with pyproject.toml.

[tool.ruff]
target-version = "py310" # oldest Python FlasH supports
line-length = 120 # the code already uses lines of up to ~120 characters

[tool.ruff.lint]
# Checks that point at real bugs, plus documentation:
#   E9 - syntax errors
#   F  - Pyflakes: undefined names, unused imports and variables
#   B  - flake8-bugbear: likely bugs, such as duplicate items in a set
#   D1 - every public module, class, method and function has a docstring
select = ["E9", "F", "B", "D1"]
ignore = [
    "D105", # magic methods like __len__ explain themselves
    "D107", # __init__ is described in the class docstring
]

[tool.ruff.lint.per-file-ignores]
# Test names say what they check.
"tests/**" = ["D1"]

